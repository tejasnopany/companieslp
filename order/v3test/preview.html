<!doctype html><html><head><meta charset="utf-8"><title>Mobile preview</title>
<style>body{margin:8px;font:13px sans-serif;background:#ddd}.row{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.ph{background:#000;padding:6px;border-radius:14px}.ph b{color:#fff;display:block;text-align:center;padding:2px}iframe{border:0;background:#fff;display:block;height:780px}
#rep{background:#fff;padding:8px;white-space:pre-wrap;font:12px monospace}</style></head><body>
<div id="rep">checking…</div>
<div class="row" id="r1"></div>
<script>
var W=((location.search.match(/w=([\d,]+)/)||[])[1]||'360,375,390').split(',').map(Number);
var v=(location.search.match(/v=([\w-]+)/)||[])[1]||'list';
var q=(location.search.match(/q=([^&]+)/)||[])[1]||'';
var hs={list:'',cart:'#cart',done:'#demo-done',filter:'#demo-filter',prod:'#demo-prod='+q,sug:'#demo-sug='+q,search:'#demo-q='+q}[v]||'';
function mk(w){var d=document.createElement('div');d.className='ph';d.innerHTML='<b>'+w+'px '+v+'</b>';var f=document.createElement('iframe');f.style.width=w+'px';f.src='./index.html'+hs;d.appendChild(f);document.getElementById('r1').appendChild(d);return f;}
var fr=[];
function start(){fr=W.map(mk);}
if(v==='cart'){fetch('products.json').then(r=>r.json()).then(function(d){var key=function(r){return r[2]?r[0]+'|'+r[2]+'|'+r[3]:r[0]+'|'+r[1]+'|'+r[3];};var s=d.p.slice().sort(function(a,b){return a[7]-b[7];});var c={};c[key(s[1])]=10;c[key(d.p.find(function(r){return r[2]==='AHASXXW061';}))]=7;c[key(d.p.find(function(r){return /^Samraat Neo 1200/.test(r[1]);}))]=4;c[key(d.p.find(function(r){return r[2]==='GHKCNBUK0';}))]=1;c[key(d.p.find(function(r){return r[2]==='GHKGCBZK0';}))]=2;localStorage.setItem('ns_cart',JSON.stringify(c));localStorage.setItem('ns_shop',JSON.stringify({shop:'Gupta Electricals',rname:'Ramesh',phone:'9876543210',town:'Chakia'}));start();});}
else {if(v!=='keep')localStorage.removeItem('ns_cart');start();}
setTimeout(function(){fr.forEach(function(f){try{var d=f.contentDocument;
 if(v==='added'){var bs=d.querySelectorAll('.add');for(var k=0;k<3&&k<bs.length;k++)bs[k].click();d.querySelectorAll('[data-a=inc]')[0]&&d.querySelectorAll('[data-a=inc]')[0].click();}
}catch(e){}});},2500);
setTimeout(function(){var out=[];fr.forEach(function(f){try{var d=f.contentDocument,el=d.documentElement;var small=[];d.querySelectorAll('button,input,a,textarea').forEach(function(b){var r=b.getBoundingClientRect();if(r.width&&r.height&&(r.height<44)&&b.offsetParent&&!b.closest('.sheet.hide'))small.push((b.className||b.tagName)+':'+Math.round(r.width)+'x'+Math.round(r.height));});
var fs=[].map.call(d.querySelectorAll('input,textarea'),function(i){return parseFloat(getComputedStyle(i).fontSize);});
var imgs=[].filter.call(d.querySelectorAll('.pic img'),function(i){return i.complete&&i.naturalWidth>0;}).length, allimg=d.querySelectorAll('.pic img').length;
out.push(f.style.width+' '+v+': docWidth='+el.scrollWidth+' viewport='+el.clientWidth+(el.scrollWidth>el.clientWidth?' OVERFLOW':' no-h-scroll')+' | min input font='+Math.min.apply(null,fs)+'px | imgs loaded '+imgs+'/'+allimg+' | cards '+d.querySelectorAll('.card').length+' | targets<44: '+(small.length?[...new Set(small)].slice(0,8).join(', '):'none'));}catch(e){out.push('err '+e);}});document.getElementById('rep').textContent=out.join('\n');},6500);
</script></body></html>
