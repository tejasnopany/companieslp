<!doctype html><html><head><meta charset="utf-8"><title>v5 check</title>
<style>body{margin:8px;font:13px sans-serif;background:#ddd}.row{display:flex;gap:10px;align-items:flex-start}
.ph{background:#000;padding:6px;border-radius:14px}.ph b{color:#fff;display:block;text-align:center;padding:2px}iframe{border:0;background:#fff;display:block;height:740px}
#rep{background:#fff;padding:8px;white-space:pre-wrap;font:12px monospace;margin-bottom:8px}</style></head><body>
<div id="rep">running checks… (about 14 s)</div>
<div class="row" id="r1"></div>
<script>
localStorage.removeItem('ns_cart');
var W=[360,390], fr=[], log={};
function mk(w){var d=document.createElement('div');d.className='ph';d.innerHTML='<b>'+w+'px</b>';var f=document.createElement('iframe');f.style.width=w+'px';f.src='./index.html';d.appendChild(f);document.getElementById('r1').appendChild(d);return f;}
fr=W.map(mk);
function L(w,s){(log[w]=log[w]||[]).push(s);}
function vis(d,id){var e=d.getElementById(id);if(!e)return false;var r=e.getBoundingClientRect();return e.classList.contains('on')&&!e.classList.contains('hide')&&r.top<d.documentElement.clientHeight&&r.height>100;}
function small(d,root){var s=[];root.querySelectorAll('button,input').forEach(function(b){var r=b.getBoundingClientRect();if(r.width&&r.height&&r.height<44)s.push((b.className||b.id||b.tagName)+' '+Math.round(r.width)+'x'+Math.round(r.height));});return s;}
function tapInside(d,el){var r=el.getBoundingClientRect();var x=r.left+r.width/2,y=r.top+r.height/2;var hit=d.elementFromPoint(x,y);return hit===el||el.contains(hit);}
function step(i,fn,ms){setTimeout(function(){fr.forEach(function(f){var w=f.style.width;try{fn(f.contentDocument,f.contentWindow,w);}catch(e){L(w,'ERROR '+e);}});},ms);}

function search(d,win,q){var i=d.getElementById('q');i.value=q;i.dispatchEvent(new win.Event('input',{bubbles:true}));}
function cardNames(d){return [].map.call(d.querySelectorAll('#list .card .nm, #list .card'),function(c){return c.querySelector? (c.querySelector('.nm')||c).textContent.trim().slice(0,60):'';});}
// 1) MCB chip: look for old junk names, then open X7 SPN DB card
step(1,function(d,win,w){var c=[].find.call(d.querySelectorAll('.chip'),function(b){return /MCB/.test(b.textContent);});c.click();},2500);
step(2,function(d,win,w){search(d,win,'x7 spn');},3300);
step(3,function(d,win,w){var cards=d.querySelectorAll('#list .card');L(w,'"x7 spn" cards: '+cards.length+' | first: '+(cards[0]?cards[0].textContent.slice(0,90):'-'));
  var card=[].find.call(cards,function(c){return /X7 SPN DB/.test(c.textContent);});L(w,'X7 SPN DB card found: '+!!card);
  var btn=card&&(card.querySelector('.choose')||card.querySelector('button')||card);if(btn)btn.click();},4800);
step(4,function(d,win,w){var ok=vis(d,'psheet');L(w,'variant sheet opens: '+(ok?'YES':'NO'));var ps=d.getElementById('psheet');
  var vcs=ps.querySelectorAll('.vc');L(w,'way chips: '+[].map.call(vcs,function(b){return b.textContent+(b.classList.contains('on')?'*':'');}).join(' / '));
  var b12=[].find.call(vcs,function(b){return /^12 Way/.test(b.textContent);});L(w,'12 Way chip tappable: '+(b12?tapInside(d,b12):'missing'));if(b12)b12.click();
  var sm=small(d,ps);L(w,'variant sheet targets <44px: '+(sm.length?sm.slice(0,6).join(', '):'none'));},6300);
step(5,function(d,win,w){var ps=d.getElementById('psheet');L(w,'after tap: '+(/DHDESHODOW12/.test(ps.textContent)?'DHDESHODOW12 ✓':'not updated')+' | name: '+(ps.querySelector('.nm')||{}).textContent);
  var add=d.getElementById('pAdd');L(w,'Add tappable: '+tapInside(d,add));add.click();},7600);
step(6,function(d,win,w){var c=JSON.parse(win.localStorage.getItem('ns_cart')||'{}');L(w,'cart: '+JSON.stringify(c));var x=d.getElementById('pdX');if(x)x.click();
  var all=[].find.call(d.querySelectorAll('.chip'),function(b){return /^All/.test(b.textContent.trim());});if(all)all.click();search(d,win,'natura gate light');},8800);
step(7,function(d,win,w){var cards=d.querySelectorAll('#list .card');L(w,'"natura gate light": '+cards.length+' card(s) | '+(cards[0]?cards[0].textContent.slice(0,110):'-'));
  search(d,win,'pankha 1200');},10200);
step(8,function(d,win,w){L(w,'"pankha 1200": '+d.getElementById('meta').textContent);search(d,win,'torch');},11400);
step(9,function(d,win,w){var cards=d.querySelectorAll('#list .card');L(w,'"torch": '+d.getElementById('meta').textContent+' | first 3: '+[].slice.call(cards,0,3).map(function(c){return c.textContent.slice(0,45);}).join(' || '));
  L(w,'page width '+d.documentElement.scrollWidth+'/'+d.documentElement.clientWidth+' | small targets in list: '+(small(d,d.getElementById('list')).slice(0,4).join(', ')||'none'));},12600);
setTimeout(function(){var o=[];W.forEach(function(w){o.push('=== '+w+'px ===\n'+(log[w+'px']||[]).join('\n'));});document.getElementById('rep').textContent=o.join('\n\n');},13500);
</script></body></html>
