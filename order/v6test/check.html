<!doctype html><html><head><meta charset="utf-8"><title>v6 check</title>
<style>body{margin:8px;font:13px sans-serif;background:#ddd}.row{display:flex;gap:10px}.ph{background:#000;padding:6px;border-radius:14px}iframe{border:0;background:#fff;display:block;height:700px}
#rep{background:#fff;padding:8px;white-space:pre-wrap;font:12px monospace;margin-bottom:8px}</style></head><body>
<div id="rep">running… (about 14 s)</div><div class="row" id="r1"></div>
<script>
localStorage.removeItem('ns_cart');
var W=[360,390],fr=[],log={};
function mk(w){var d=document.createElement('div');d.className='ph';var f=document.createElement('iframe');f.style.width=w+'px';f.src='./index.html';d.appendChild(f);document.getElementById('r1').appendChild(d);
 f.addEventListener('load',function(){try{f.contentWindow.addEventListener('error',function(e){L(w+'px','JS ERROR '+e.message);});}catch(e){}});return f;}
fr=W.map(mk);
function L(w,s){(log[w]=log[w]||[]).push(s);}
function search(d,win,q){var i=d.getElementById('q');i.value=q;i.dispatchEvent(new win.Event('input',{bubbles:true}));}
function names(d,n){return [].slice.call(d.querySelectorAll('#list .card'),0,n).map(function(c){return (c.querySelector('.nm')||c).textContent.trim().slice(0,70);}).join(' || ');}
function step(fn,ms){setTimeout(function(){fr.forEach(function(f){var w=f.style.width;try{fn(f.contentDocument,f.contentWindow,w);}catch(e){L(w,'ERROR '+e);}});},ms);}
var qs=['cat6 blue','x7 sp mcb','stadx sp mcb','crysta deco','trim nxt','multicore 2.5','pankha 1200'];
qs.forEach(function(q,k){
 step(function(d,win,w){search(d,win,q);},2500+k*1500);
 step(function(d,win,w){L(w,'"'+q+'": '+d.getElementById('meta').textContent+' | '+names(d,4));},3300+k*1500);
});
var t=2500+qs.length*1500+300;
step(function(d,win,w){search(d,win,'x7 sp mcb');},t);
step(function(d,win,w){var c=d.querySelector('#list .card');var b=c&&(c.querySelector('.choose')||c.querySelector('button')||c);if(b)b.click();},t+800);
step(function(d,win,w){var ps=d.getElementById('psheet');L(w,'sheet open: '+(ps&&ps.classList.contains('on'))+' | '+(ps?ps.textContent.replace(/\s+/g,' ').slice(0,200):''));var a=d.getElementById('pAdd');if(a)a.click();},t+1800);
step(function(d,win,w){L(w,'cart: '+(win.localStorage.getItem('ns_cart')||'').slice(0,160));L(w,'title/brand: '+d.title+' | page width '+d.documentElement.scrollWidth+'/'+d.documentElement.clientWidth);},t+2800);
setTimeout(function(){var o=[];W.forEach(function(w){o.push('=== '+w+'px ===\n'+(log[w+'px']||[]).join('\n'));});document.getElementById('rep').textContent=o.join('\n\n');},t+3600);
</script></body></html>
