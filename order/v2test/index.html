<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#d71920">
<meta name="format-detection" content="telephone=no">
<title>Havells Galaxy – Sangam, Motihari · Retailer Order</title>
<link rel="preload" href="products.json" as="fetch" crossorigin>
<style>
:root{--red:#d71920;--red2:#a8111a;--redbg:#fdecec;--ink:#17171a;--mut:#6a6a72;--line:#ececf0;--bg:#f4f4f6;--ok:#0a7d32;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
body.lock{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
svg{display:block}
.hide{display:none!important}
/* brand */
.brand{background:linear-gradient(135deg,#e0252c,#a8111a);color:#fff;padding:12px 14px 12px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:11px}
.mark{width:38px;height:38px;border-radius:11px;background:#fff;color:var(--red);font-weight:800;display:grid;place-items:center;font-size:17px;flex:none;letter-spacing:-.5px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.brand h1{font-size:17px;margin:0;line-height:1.2;font-weight:700}
.brand h1 small{display:block;font-weight:400;opacity:.88;font-size:12.5px;margin-top:1px}
/* sticky toolbar */
.tool{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);-webkit-backdrop-filter:saturate(1.6) blur(10px);backdrop-filter:saturate(1.6) blur(10px);border-bottom:1px solid var(--line);padding:8px 10px 0}
.srow{display:flex;gap:8px;align-items:center}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#8b8b93;pointer-events:none}
.search input{width:100%;height:46px;padding:0 42px 0 38px;border:1px solid #dcdce1;border-radius:12px;background:#f6f6f8;font-size:16px;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus{outline:none;border-color:var(--red);background:#fff;box-shadow:0 0 0 3px rgba(215,25,32,.12)}
.search .x{position:absolute;right:1px;top:1px;width:44px;height:44px;border:0;background:none;font-size:22px;color:var(--mut);display:none;border-radius:12px}
.fbtn{position:relative;flex:none;height:46px;min-width:46px;padding:0 12px;border:1px solid #dcdce1;border-radius:12px;background:#fff;display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px}
.fbtn.on{border-color:var(--red);color:var(--red);background:var(--redbg)}
.fbtn .n{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 0 9px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;min-height:44px;padding:0 13px 0 10px;border:1px solid #dcdce1;background:#fff;border-radius:999px;font-size:14.5px;white-space:nowrap;scroll-snap-align:start;transition:background .15s,color .15s}
.chip svg{width:19px;height:19px;color:var(--red)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.chip.on svg{color:#fff}
/* list */
main{padding:8px 10px calc(112px + env(safe-area-inset-bottom));max-width:780px;margin:0 auto}
.meta{display:flex;align-items:center;gap:8px;margin:2px 2px 8px;font-size:13px;color:var(--mut);min-height:44px}
.meta .cnt{flex:1;min-width:0}
.meta .cnt b{color:var(--ink)}
.sortb{flex:none;display:flex;align-items:center;gap:5px;min-height:44px;padding:0 12px;border:1px solid #dcdce1;border-radius:999px;background:#fff;font-size:13.5px;font-weight:600}
.act{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 8px}
.act button{min-height:36px;padding:0 10px 0 12px;border:1px solid #f3c2c4;background:var(--redbg);color:var(--red2);border-radius:999px;font-size:13px;display:flex;align-items:center;gap:6px}
.act button i{font-style:normal;font-size:16px;line-height:1}
.act .clr{background:#fff;border-color:#dcdce1;color:var(--ink);text-decoration:underline}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:8px;display:grid;grid-template-columns:72px 1fr;gap:4px 11px;align-items:start;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.pic{grid-row:span 2;width:72px;height:72px;border-radius:11px;background:#fff;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.pic.ic{background:var(--icbg,#f3f3f6);border-color:transparent}
.pic.ic svg{width:34px;height:34px;color:var(--icfg,#8b8b93)}
.info{min-width:0}
.nm{font-size:15px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.sub{font-size:12px;color:var(--mut);margin-top:2px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bdg{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;letter-spacing:.2px;padding:2px 7px;border-radius:6px;margin:0 0 4px;vertical-align:middle}
.bdg.b2{background:#fff3d6;color:#8a5a00}
.bdg.b1{background:#eaf4ff;color:#0b5aa6}
.bot{grid-column:2;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.pr{min-width:0;line-height:1.2}
.rt{color:var(--red2);font-weight:800;font-size:17px}
.lp{color:#8b8b93;text-decoration:line-through;font-size:12.5px;margin-left:5px}
.off{color:var(--ok);font-size:11.5px;font-weight:700;margin-left:4px}
.unit{display:block;color:var(--mut);font-size:11.5px}
.add{flex:none;height:44px;min-width:84px;padding:0 16px;border:1.5px solid var(--red);color:var(--red);background:#fff;border-radius:12px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:4px;transition:transform .1s}
.add:active{transform:scale(.96);background:var(--redbg)}
.step{flex:none;display:flex;align-items:center;border-radius:12px;overflow:hidden;background:var(--red);box-shadow:0 2px 6px rgba(215,25,32,.25)}
.step button{width:44px;height:44px;border:0;background:transparent;color:#fff;font-size:22px;line-height:1;font-weight:600}
.step button:active{background:rgba(0,0,0,.15)}
.step input{width:46px;height:44px;border:0;background:#fff;text-align:center;font-size:16px;font-weight:700;color:var(--ink);-moz-appearance:textfield;border-radius:0}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.more{display:block;width:100%;min-height:48px;border:1px dashed #c8c8cd;border-radius:12px;background:#fff;margin:6px 0 12px;font-weight:600}
.empty{text-align:center;color:var(--mut);padding:36px 14px;background:#fff;border-radius:var(--r);border:1px solid var(--line)}
.empty svg{width:44px;height:44px;margin:0 auto 8px;color:#c4c4cb}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .eb{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.empty .eb button{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid #dcdce1;background:#fff;font-weight:600}
/* skeleton */
.sk .pic,.sk .l{background:linear-gradient(90deg,#eee 0,#f7f7f7 40%,#eee 80%);background-size:300% 100%;animation:sh 1.2s infinite linear;border:0}
.sk .l{height:12px;border-radius:6px;margin:6px 0}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
/* cart bar */
.bar{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;min-height:58px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.25);border:0;text-align:left;font-size:14px;max-width:760px;margin:0 auto;transition:transform .2s}
.bar .bi{position:relative;flex:none}
.bar .bi b{position:absolute;top:-8px;right:-10px;background:var(--red);color:#fff;font-size:11px;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 4px}
.bar .bt{flex:1;min-width:0;line-height:1.2}
.bar .bt b{font-size:17px;display:block}
.bar .bt small{opacity:.7;font-size:11.5px}
.bar .go{flex:none;background:var(--red);color:#fff;border-radius:11px;padding:0 14px;min-height:44px;display:flex;align-items:center;font-weight:700;white-space:nowrap}
.bar.bump{animation:bump .35s}
@keyframes bump{30%{transform:scale(1.03)}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#1f8f45;color:#fff;padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600;z-index:40;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 40px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;opacity:0;transition:opacity .2s}
.ov.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:#fff;border-radius:20px 20px 0 0;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease;max-width:780px;margin:0 auto}
.sheet.on{transform:none}
.sh{display:flex;align-items:center;padding:6px 8px 6px 16px;border-bottom:1px solid var(--line)}
.sh h2{flex:1;margin:0;font-size:18px}
.sh button{min-width:44px;min-height:44px;border:0;background:none;font-size:15px;color:var(--red);font-weight:600}
.sh .cl{font-size:26px;color:var(--mut);font-weight:400}
.grab{width:40px;height:5px;border-radius:3px;background:#d8d8dd;margin:8px auto 0}
.sb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 12px;flex:1}
.fg{padding:12px 0;border-bottom:1px solid var(--line)}
.fg:last-child{border-bottom:0}
.fg h3{font-size:14px;margin:0 0 9px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{min-height:40px;padding:0 13px;border:1px solid #dcdce1;border-radius:10px;background:#fff;font-size:14px;display:flex;align-items:center;gap:6px}
.opt small{color:var(--mut);font-size:12px}
.opt.on{border-color:var(--red);background:var(--redbg);color:var(--red2);font-weight:600}
.opt.on small{color:var(--red2)}
.prow{display:flex;gap:8px;align-items:center;margin-top:9px}
.prow input{flex:1;min-width:0;height:44px;border:1px solid #dcdce1;border-radius:10px;padding:0 10px;font-size:16px}
.hint{font-size:13px;color:var(--mut)}
.sf{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.sf button{min-height:50px;border-radius:12px;font-weight:700;font-size:16px}
.sf .c{flex:none;padding:0 18px;background:#fff;border:1px solid #dcdce1}
.sf .a{flex:1;background:var(--red);color:#fff;border:0}
/* cart */
.sec{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.sec h2{font-size:17px;margin:0 0 6px}
.back{border:0;background:none;color:var(--red);font-weight:700;min-height:44px;padding:0 2px;font-size:15px}
.line{display:grid;grid-template-columns:52px 1fr;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .pic{width:52px;height:52px;grid-row:span 2;border-radius:9px}
.line .pic.ic svg{width:26px;height:26px}
.line .nm{font-size:14px}
.ctl{grid-column:2;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rm{border:0;background:none;color:var(--mut);font-size:13px;text-decoration:underline;min-height:44px;min-width:44px;padding:0 6px}
.amt{margin-left:auto;font-weight:800;white-space:nowrap;font-size:16px}
.tot{display:flex;justify-content:space-between;font-size:19px;font-weight:800;padding-top:10px;border-top:2px solid var(--ink);margin-top:6px}
.subt{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);padding-top:4px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px;font-weight:600}
.f{width:100%;min-height:48px;padding:11px 12px;border:1px solid #dcdce1;border-radius:12px;font-size:16px;background:#fff;-webkit-appearance:none;appearance:none}
.f:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(215,25,32,.12)}
.f.err{border-color:var(--red);background:#fff5f5}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:12px;border-radius:14px;border:0;font-size:17px;font-weight:700;margin-top:10px;text-align:center;text-decoration:none}
.btn.p{background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(215,25,32,.3)}
.btn.p:disabled{opacity:.6}
.btn.s{background:#fff;color:#128c3e;border:2px solid #25d366}
.btn.g{background:#fff;color:var(--ink);border:1px solid #dcdce1}
.msg{font-size:13.5px;margin-top:8px;color:var(--mut);text-align:center}
.warn{background:#fff7e6;border:1px solid #ffd591;color:#874d00;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.ok{text-align:center;padding:26px 8px}
.ok .tick{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;font-size:40px;display:grid;place-items:center;margin:0 auto 12px;box-shadow:0 6px 18px rgba(10,125,50,.3)}
.ok h2{margin:0;font-size:22px}
.ok .msg{font-size:15px;line-height:1.7;color:var(--ink)}
footer{font-size:12px;color:var(--mut);padding:14px 4px 20px;line-height:1.55}
footer a{color:var(--red2);display:inline-block;min-height:44px;padding:12px 2px;font-weight:600}
.dates div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #ddd;padding:3px 0}
.dates div span:last-child{text-align:right}
@media (max-width:370px){.card{grid-template-columns:62px 1fr;gap:4px 9px;padding:9px}.pic{width:62px;height:62px}.nm{font-size:14.5px}.add{min-width:74px;padding:0 12px}.step input{width:40px}.fbtn span{display:none}}
@media (min-width:640px){.card{grid-template-columns:88px 1fr}.pic{width:88px;height:88px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="brand">
  <div class="mark">SG</div>
  <h1>Havells Galaxy – Sangam<small>Bank Road, Motihari · Retailer order · Rates incl. GST</small></h1>
</div>
<div class="tool" id="shopTop">
  <div class="srow">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search name or model code…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search products">
      <button class="x" id="qx" aria-label="Clear search">×</button>
    </div>
    <button class="fbtn" id="fbtn" aria-label="Filters and sort"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Filter</span><b class="n hide" id="fn">0</b></button>
  </div>
  <div class="chips" id="chips" role="tablist"></div>
</div>

<main>
  <section id="vShop">
    <div class="meta"><div class="cnt" id="meta">Loading price list…</div><button class="sortb" id="sortb"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg><span id="sortl">Popular</span></button></div>
    <div class="act" id="act"></div>
    <div id="list"><div class="card sk"><div class="pic"></div><div class="info"><div class="l" style="width:80%"></div><div class="l" style="width:55%"></div></div><div class="bot"><div class="l" style="width:90px;height:18px"></div></div></div><div class="card sk"><div class="pic"></div><div class="info"><div class="l" style="width:80%"></div><div class="l" style="width:55%"></div></div><div class="bot"><div class="l" style="width:90px;height:18px"></div></div></div><div class="card sk"><div class="pic"></div><div class="info"><div class="l" style="width:80%"></div><div class="l" style="width:55%"></div></div><div class="bot"><div class="l" style="width:90px;height:18px"></div></div></div><div class="card sk"><div class="pic"></div><div class="info"><div class="l" style="width:80%"></div><div class="l" style="width:55%"></div></div><div class="bot"><div class="l" style="width:90px;height:18px"></div></div></div><div class="card sk"><div class="pic"></div><div class="info"><div class="l" style="width:80%"></div><div class="l" style="width:55%"></div></div><div class="bot"><div class="l" style="width:90px;height:18px"></div></div></div><div class="card sk"><div class="pic"></div><div class="info"><div class="l" style="width:80%"></div><div class="l" style="width:55%"></div></div><div class="bot"><div class="l" style="width:90px;height:18px"></div></div></div></div>
  </section>

  <section id="vCart" class="hide">
    <button class="back" id="backShop">← Add more items</button>
    <div class="sec"><h2>Your order</h2><div id="lines"></div><div id="tots"></div></div>
    <div class="sec">
      <h2>Shop details</h2>
      <label for="shop">Shop name *</label><input class="f" id="shop" autocomplete="organization">
      <label for="rname">Retailer name</label><input class="f" id="rname" autocomplete="name">
      <label for="phone">Phone</label><input class="f" id="phone" type="tel" inputmode="tel" autocomplete="tel">
      <label for="town">Town</label><input class="f" id="town" autocomplete="address-level2">
      <label for="note">Note (optional)</label><textarea class="f" id="note" rows="2"></textarea>
    </div>
    <button class="btn p" id="place">Place Order</button>
    <a class="btn s" id="wa" href="#" target="_blank" rel="noopener"><svg width="20" height="20" viewBox="0 0 24 24" fill="#25d366"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.2z"/></svg>Send order on WhatsApp</a>
    <div class="msg">Place Order sends your order to our office by email.</div>
    <div id="cartWarn"></div>
  </section>

  <section id="vDone" class="hide">
    <div class="ok">
      <div class="tick">✓</div>
      <h2>Order received</h2>
      <div class="msg" id="doneMsg"></div>
      <a class="btn s" id="wa2" href="#" target="_blank" rel="noopener">Also send on WhatsApp (optional)</a>
      <button class="btn g" id="newOrder">Start a new order</button>
    </div>
  </section>

  <footer id="foot"></footer>
</main>

<button class="bar hide" id="bar" aria-label="View cart"><span class="bi"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20.5" r="1"/><circle cx="17" cy="20.5" r="1"/></svg><b id="bCount">0</b></span><span class="bt"><b id="bTotal">₹0</b><small>incl. GST</small></span><span class="go">View cart →</span></button>
<div class="toast" id="toast"></div>
<div class="ov hide" id="ov"></div>

  <div class="grab"></div>

/* ===== order logic (pure; tested with node) ===== */
var WA_NUMBER = '918310462391';
var ENDPOINT = 'https://api.web3forms.com/submit';
/* public Web3Forms access keys (mail goes only to the inbox that owns the key) */
var ACCESS_KEY = { SG: '6d2297d6-0617-47b6-a12a-eb0d9f57e172', NS: 'ceff9854-6508-4b83-bf38-5696449670f6' };
var BRAND = 'Havells Galaxy – Sangam, Motihari';
var ROUTE_NAME = { SG: 'Sangam', NS: 'New Sangam' };          /* internal only (email body) */
var ROUTE_UI = { SG: 'Havells items', NS: 'Chimney / hob items' }; /* shown to retailers */
function inr(n){ return '₹' + Math.round(n).toLocaleString('en-IN'); }
function fmtDate(d){
  var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var h=d.getHours(), mi=('0'+d.getMinutes()).slice(-2), ap=h>=12?'pm':'am'; h=h%12||12;
  return ('0'+d.getDate()).slice(-2)+'-'+m[d.getMonth()]+'-'+d.getFullYear()+' '+h+':'+mi+' '+ap;
}
/* lines: [{code,name,qty,rate,unit,route}] */
function lineText(l, i){
  var label = (l.code ? l.code + ' – ' : '') + l.name;
  return (i+1) + '. ' + label + ' × ' + l.qty + (l.unit ? ' (' + l.unit + ')' : '') + ' @ ' + inr(l.rate) + ' = ' + inr(l.rate * l.qty);
}
function total(lines){ return lines.reduce(function(s,l){ return s + l.rate * l.qty; }, 0); }
function shopBlock(s){
  var out = ['Shop: ' + s.shop];
  if (s.rname) out.push('Retailer: ' + s.rname);
  if (s.phone) out.push('Phone: ' + s.phone);
  if (s.town) out.push('Town: ' + s.town);
  return out;
}
function waText(shop, lines, date){
  var t = ['*New Havells Order – ' + BRAND + '*', 'Date: ' + fmtDate(date)].concat(shopBlock(shop));
  t.push('');
  lines.forEach(function(l, i){ t.push(lineText(l, i)); });
  t.push('');
  t.push('*Grand total: ' + inr(total(lines)) + ' (incl. GST)*');
  if (shop.note) t.push('Note: ' + shop.note);
  return t.join('\n');
}
function orderId(date, rnd){
  return 'SG' + date.getFullYear().toString().slice(2) + ('0' + (date.getMonth() + 1)).slice(-2) + ('0' + date.getDate()).slice(-2) + '-' + (rnd || Math.random().toString(36).slice(2, 6).toUpperCase());
}
function waLink(shop, lines, date){ return 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(waText(shop, lines, date)); }
function splitByRoute(lines){
  var g = {};
  lines.forEach(function(l){ (g[l.route] = g[l.route] || []).push(l); });
  return g;
}
function emailPayload(route, shop, lines, date, orderId){
  var p = {
    access_key: ACCESS_KEY[route],
    subject: BRAND + ' | New order – ' + shop.shop,
    from_name: BRAND + ' – Order page (' + shop.shop + ')',
    botcheck: '',
    'Order for': ROUTE_NAME[route] + (route === 'NS' ? ' (Chimney / Cooktop / Hob)' : ' (Havells products)'),
    'Order ID': orderId,
    'Date': fmtDate(date),
    'Shop name': shop.shop,
    'Retailer name': shop.rname || '-',
    'Phone': shop.phone || '-',
    'Town': shop.town || '-',
    'Items': lines.map(lineText).join('\n'),
    'Subtotal': inr(total(lines)) + ' (incl. GST)'
  };
  if (shop.note) p['Note'] = shop.note;
  return p;
}
if (typeof module !== 'undefined') module.exports = { BRAND: BRAND, ROUTE_UI: ROUTE_UI, orderId: orderId, lineText: lineText, waText: waText, waLink: waLink, splitByRoute: splitByRoute, emailPayload: emailPayload, total: total, inr: inr, ENDPOINT: ENDPOINT, ACCESS_KEY: ACCESS_KEY };

<script>

};
var TINT = ['#fff1e6','#eef6ff','#fff0f0','#e9f9f5','#eef3ff','#f3f0ff','#fff6e5','#fdeef7','#fff4e0','#eef8ee','#f0f4f8','#f6f1ea','#f1f1f7','#fffbe6','#eef7fb','#f2f9e9'];

var SYN = {'Fans':'fan pankha','Small Appliances & Heaters':'appliance','Water Heaters':'geyser gizer heater','Air Coolers':'cooler','Pumps':'pump motor','Chimneys':'chimney kitchen','Cooktops & Hobs':'gas stove chulha','Wires & Cables':'wire cable','MCB, RCCB & DB':'mcb db','Havells Switches':'switch modular','Crabtree Switches':'switch modular','LED Lighting':'led light','Professional Luminaires':'light'};

function icon(name){ return P + (IC[name] || IC.all) + '</svg>'; }
function pic(r, cls){
  if (r[8]) return '<div class="pic' + (cls || '') + '"><img src="' + (window.IMGB || 'img/') + ' + r[8] + '.webp" alt="" loading="lazy" decoding="async" width="72" height="72" onerror="this.parentNode.classList.add(\'ic\');this.outerHTML=window.__ic(' + r[0] + ')"></div>';
  return '<div class="pic ic' + (cls || '') + '" style="--icbg:' + TINT[r[0] % 16] + ';--icfg:' + TFG[r[0] % 16] + '">' + icon(CATS[r[0]]) + '</div>';
}
window.__ic = function(c){ return icon(CATS[c]); };

/* ---------- load ---------- */
fetch('products.json', {cache: 'no-cache'}).then(function(r){ return r.json(); }).then(function(d){
  D = d; CATS = d.cats; d.route.NS.forEach(function(i){ NSC[i] = 1; });
  d.p.forEach(function(r){
    var f = r[10] || {};
    var s = [r[1], r[2], r[5], CATS[r[0]], SHORT[CATS[r[0]]], SYN[CATS[r[0]]], f.t, f.x, f.y, f.b, r[11]].join(' ').toLowerCase();
    if (f.x) s += ' ' + f.x.replace(/\s+/g, '').toLowerCase() + ' ' + f.x.replace(/\s*sq mm/, 'mm').replace(/\s+/g, '').toLowerCase();

  });

  save('ns_cart', cart);
  chips(); render(); bar(); foot();
  if (location.hash === '#cart' && count()) showCart();
  if (location.hash === '#demo-done') { $('wa2').href = '#'; $('doneMsg').innerHTML = 'Order ID <b>SG261027-DEMO</b><br>₹32,949 (incl. GST)<br>✓ Havells items – received<br>✓ Chimney / hob items – received'; show('vDone'); }
  if (location.hash === '#demo-filter') { cat = 0; syncChips(); render(); openSheet(); }
}).catch(function(){ $('list').innerHTML = '<div class="empty"><b>Could not load the price list</b>Please check your internet and reload the page.<div class="eb"><button onclick="location.reload()">Reload</button></div></div>'; $('meta').textContent = ''; });

function chips(){
  var h = '<button class="chip on" data-c="-1" role="tab">' + icon('all') + 'All</button>';
  CATS.forEach(function(c, i){ h += '<button class="chip" data-c="' + i + '" role="tab">' + icon(c) + esc(SHORT[c] || c) + '</button>'; });
  $('chips').innerHTML = h;
  $('chips').onclick = function(e){
    var b = e.target.closest('.chip'); if (!b) return;
    var c = +b.dataset.c; if (c === cat) return;

function syncChips(){

}
function scrollTop(){ var t = $('shopTop').offsetTop; if (window.scrollY > t) window.scrollTo(0, t); }

/* ---------- filtering ---------- */
function words(){ return q.toLowerCase().replace(/sq\.?\s*mm/g, 'sq mm').split(/\s+/).filter(Boolean); }
function textOk(r, w){ for (var i = 0; i < w.length; i++) { var x = w[i]; if (r.s.indexOf(x) < 0 && r.c.indexOf(x.replace(/[.\-–/()]+/g, '')) < 0) return false; } return true; }
function has(o){ for (var k in o) return true; return false; }
function pass(r, w, flt, skip){
  if (cat >= 0 && r[0] !== cat) return false;
  var f = r[10] || {};
  if (skip !== 't' && has(flt.t) && !flt.t[f.t]) return false;
  if (skip !== 'x' && has(flt.x) && !flt.x[f.x]) return false;
  if (skip !== 'y' && has(flt.y) && !flt.y[f.y]) return false;
  if (skip !== 'b' && has(flt.b) && !flt.b[f.b || 'Havells']) return false;
  if (flt.pmin !== '' && r[4] < +flt.pmin) return false;
  if (flt.pmax !== '' && r[4] > +flt.pmax) return false;
  return textOk(r, w);
}
var SORTS = { pop: 'Popular', lo: 'Price: low to high', hi: 'Price: high to low', az: 'Name A–Z' };
function sorter(a, b){
  if (sort === 'lo') return a[4] - b[4] || a[7] - b[7];
  if (sort === 'hi') return b[4] - a[4] || a[7] - b[7];
  if (sort === 'az') return a[1].localeCompare(b[1]);
  return a[7] - b[7];
}
function matches(){ var w = words(); return D.p.filter(function(r){ return pass(r, w, F); }).sort(sorter); }

/* ---------- cards ---------- */
function badge(r){ return r[9] === 2 ? '<span class="bdg b2">★ Best seller</span><br>' : r[9] === 1 ? '<span class="bdg b1">Popular</span><br>' : ''; }
function card(r){
  var k = key(r), n = cart[k] || 0, off = Math.round((1 - r[4] / r[3]) * 100);

    '<div class="bot"><div class="pr"><span class="rt">' + inr(r[4]) + '</span><span class="lp">' + inr(r[3]) + '</span><span class="off">' + off + '% off</span>' +

function stepper(n){ return '<div class="step"><button data-a="dec" aria-label="Less">−</button><input inputmode="numeric" pattern="[0-9]*" value="' + n + '" data-a="set" aria-label="Quantity"><button data-a="inc" aria-label="More">+</button></div>'; }
var io;

  if (!m.length) h = '<div class="empty">' + P + '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M8.5 11h5"/></svg><b>No items found</b>Try a shorter word, a model code, or clear the filters.<div class="eb">' +
    (q ? '<button data-e="q">Clear search</button>' : '') + (nF() ? '<button data-e="f">Clear filters</button>' : '') + (cat >= 0 ? '<button data-e="c">All categories</button>' : '') + '</div></div>';
  $('list').innerHTML = h;
  var mb = $('more');
  if (io) io.disconnect();
  if (mb) { mb.onclick = function(){ shown += PAGE * 2; render(); };
    if (window.IntersectionObserver) { io = new IntersectionObserver(function(es){ if (es[0].isIntersecting) { io.disconnect(); shown += PAGE * 2; render(); } }, { rootMargin: '700px' }); io.observe(mb); } }
}
$('list').addEventListener('click', function(e){
  var eb = e.target.closest('[data-e]');
  if (eb) { var t = eb.dataset.e; if (t === 'q') { $('q').value = ''; q = ''; $('qx').style.display = 'none'; } if (t === 'f') clearF(F); if (t === 'c') { cat = -1; F.t = {}; F.x = {}; F.y = {}; syncChips(); } shown = PAGE; render(); }
});

/* ---------- active filter chips ---------- */
function nF(){ return Object.keys(F.t).length + Object.keys(F.x).length + Object.keys(F.y).length + Object.keys(F.b).length + (F.pmin !== '' || F.pmax !== '' ? 1 : 0); }
function clearF(o){ o.t = {}; o.x = {}; o.y = {}; o.b = {}; o.pmin = ''; o.pmax = ''; }
function activeChips(){
  var h = [], n = nF();
  ['t', 'x', 'y', 'b'].forEach(function(g){ Object.keys(F[g]).forEach(function(v){ h.push('<button data-g="' + g + '" data-v="' + esc(v) + '">' + esc(v) + '<i>×</i></button>'); }); });
  if (F.pmin !== '' || F.pmax !== '') h.push('<button data-g="p">' + (F.pmin !== '' ? inr(F.pmin) : '₹0') + ' – ' + (F.pmax !== '' ? inr(F.pmax) : 'any') + '<i>×</i></button>');
  if (n > 1) h.push('<button class="clr" data-g="all">Clear all</button>');
  $('act').innerHTML = h.join('');
  $('act').classList.toggle('hide', !n);
  $('fn').textContent = n; $('fn').classList.toggle('hide', !n); $('fbtn').classList.toggle('on', !!n || sort !== 'pop');

  var b = e.target.closest('button'); if (!b) return;

/* ---------- filter sheet ---------- */
var DR = null, dsort = 'pop';
function copyF(o){ return { t: Object.assign({}, o.t), x: Object.assign({}, o.x), y: Object.assign({}, o.y), b: Object.assign({}, o.b), pmin: o.pmin, pmax: o.pmax }; }
function openSheet(){
  DR = copyF(F); dsort = sort; drawSheet();
  $('ov').classList.remove('hide'); $('sheet').classList.remove('hide'); document.body.classList.add('lock');
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ $('ov').classList.add('on'); $('sheet').classList.add('on'); }); });

  $('ov').classList.remove('on'); $('sheet').classList.remove('on'); document.body.classList.remove('lock');
  setTimeout(function(){ $('ov').classList.add('hide'); $('sheet').classList.add('hide'); }, 230);
}
function facetVals(g){
  var w = words(), c = {};
  D.p.forEach(function(r){
    if (!pass(r, w, DR, g)) return;
    var f = r[10] || {}, v = g === 'b' ? (f.b || 'Havells') : f[g];
    if (v) c[v] = (c[v] || 0) + 1;
  });
  Object.keys(DR[g]).forEach(function(v){ if (!c[v]) c[v] = 0; });
  var ks = Object.keys(c);
  if (g === 'x' || g === 'y') ks.sort(function(a, b){ var x = parseFloat(a), y = parseFloat(b); return (isNaN(x) || isNaN(y)) ? (isNaN(x) - isNaN(y)) || a.localeCompare(b) : x - y; });
  else ks.sort(function(a, b){ return c[b] - c[a]; });
  return ks.map(function(k){ return [k, c[k]]; });
}
function optBlock(title, g, vals){
  if (vals.length < 2 && !Object.keys(DR[g]).length) return '';
  return '<div class="fg"><h3>' + esc(title) + '</h3><div class="opts">' + vals.map(function(v){
    return '<button class="opt' + (DR[g][v[0]] ? ' on' : '') + '" data-g="' + g + '" data-v="' + esc(v[0]) + '">' + esc(v[0]) + ' <small>' + v[1] + '</small></button>';
  }).join('') + '</div></div>';
}
var PRESET = [['', 500, 'Under ₹500'], [500, 2000, '₹500 – 2,000'], [2000, 5000, '₹2,000 – 5,000'], [5000, 15000, '₹5,000 – 15,000'], [15000, '', '₹15,000+']];
function drawSheet(){
  var h = '<div class="fg"><h3>Sort by</h3><div class="opts">' + Object.keys(SORTS).map(function(k){ return '<button class="opt' + (dsort === k ? ' on' : '') + '" data-s="' + k + '">' + SORTS[k] + '</button>'; }).join('') + '</div></div>';
  if (cat >= 0) {
    var cn = CATS[cat];
    h += optBlock((D.tl && D.tl[cn]) || 'Type', 't', facetVals('t'));
    h += optBlock((D.xl && D.xl[cn]) || 'Size', 'x', facetVals('x'));
    h += optBlock('Poles', 'y', facetVals('y'));
  } else h += '<div class="fg"><h3>Type &amp; size</h3><div class="hint">Pick a category (Fans, Wires, MCB…) to filter by type, sweep, sq mm, amps and more.</div></div>';
  h += optBlock('Brand', 'b', facetVals('b'));
  h += '<div class="fg"><h3>Your Rate (₹)</h3><div class="opts">' + PRESET.map(function(p, i){ var on = String(DR.pmin) === String(p[0]) && String(DR.pmax) === String(p[1]); return '<button class="opt' + (on ? ' on' : '') + '" data-p="' + i + '">' + p[2] + '</button>'; }).join('') + '</div>' +
    '<div class="prow"><input id="pmin" inputmode="numeric" pattern="[0-9]*" placeholder="Min ₹" value="' + esc(DR.pmin) + '" aria-label="Minimum price"><span>–</span><input id="pmax" inputmode="numeric" pattern="[0-9]*" placeholder="Max ₹" value="' + esc(DR.pmax) + '" aria-label="Maximum price"></div></div>';
  var st = $('sb').scrollTop; $('sb').innerHTML = h; $('sb').scrollTop = st;
  ['pmin', 'pmax'].forEach(function(id){ $(id).addEventListener('input', function(){ DR[id] = this.value.replace(/[^\d]/g, ''); countBtn(); }); $(id).addEventListener('change', drawSheet); });
  countBtn();
}
function countBtn(){ var w = words(), n = 0; D.p.forEach(function(r){ if (pass(r, w, DR)) n++; }); $('shA').textContent = n ? 'Show ' + n.toLocaleString('en-IN') + ' item' + (n === 1 ? '' : 's') : 'No items – change filters'; }
$('sb').onclick = function(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.s) dsort = b.dataset.s;
  else if (b.dataset.p) { var p = PRESET[+b.dataset.p], on = String(DR.pmin) === String(p[0]) && String(DR.pmax) === String(p[1]); DR.pmin = on ? '' : String(p[0]); DR.pmax = on ? '' : String(p[1]); }
  else if (b.dataset.g) { var g = b.dataset.g, v = b.dataset.v; if (DR[g][v]) delete DR[g][v]; else DR[g][v] = 1; }
  drawSheet();
};
$('fbtn').onclick = openSheet; $('sortb').onclick = openSheet;
$('ov').onclick = closeSheet; $('shX').onclick = closeSheet; $('shC').onclick = closeSheet;
$('shClr').onclick = function(){ clearF(DR); dsort = 'pop'; drawSheet(); };
$('shA').onclick = function(){ F = DR; sort = dsort; shown = PAGE; closeSheet(); render(); scrollTop(); };
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !$('sheet').classList.contains('hide')) closeSheet(); });

/* ---------- cart actions ---------- */
function setQty(k, n){
  n = Math.max(0, Math.min(9999, parseInt(n, 10) || 0));
  if (n) cart[k] = n; else delete cart[k];
  save('ns_cart', cart); bar();
}
var tt;
function toast(t){ var el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(function(){ el.classList.remove('on'); }, 1300); }
function bump(){ var b = $('bar'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
function onListClick(e){
  var b = e.target.closest('[data-a]'); if (!b || b.tagName === 'INPUT') return;
  var c = e.target.closest('[data-k]'); if (!c) return;
  var k = c.dataset.k, n = cart[k] || 0, r = BYKEY[k];
  if (b.dataset.a === 'add' || b.dataset.a === 'inc') n++;
  if (b.dataset.a === 'dec') n--;
  setQty(k, n);
  if (b.dataset.a === 'add') { toast('✓ Added · ' + r[1]); bump(); if (navigator.vibrate) try { navigator.vibrate(12); } catch(x){} }
  if (c.classList.contains('card')) { c.outerHTML = card(r); } else renderCart();
}
function onListChange(e){
  if (e.target.dataset.a !== 'set') return;
  var c = e.target.closest('[data-k]'); setQty(c.dataset.k, e.target.value);
  if (c.classList.contains('card')) c.outerHTML = card(BYKEY[c.dataset.k]); else renderCart();
}
$('list').addEventListener('click', onListClick); $('list').addEventListener('change', onListChange);
$('lines').addEventListener('click', function(e){
  var rm = e.target.closest('.rm'); if (rm) { setQty(rm.closest('[data-k]').dataset.k, 0); renderCart(); return; }
  onListClick(e);
});
$('lines').addEventListener('change', onListChange);

var tmr; $('q').addEventListener('input', function(){
  clearTimeout(tmr); var v = this.value; $('qx').style.display = v ? 'block' : 'none';
  tmr = setTimeout(function(){ q = v.trim(); shown = PAGE; render(); }, 160);
});
$('q').addEventListener('keydown', function(e){ if (e.key === 'Enter') this.blur(); });
$('qx').onclick = function(){ $('q').value = ''; q = ''; this.style.display = 'none'; shown = PAGE; render(); $('q').focus(); };

function cartLines(){
  return Object.keys(cart).map(function(k){
    var r = BYKEY[k]; if (!r) return null;
    return { key: k, code: r[2], name: r[1], qty: cart[k], rate: r[4], lp: r[3], unit: r[6], route: NSC[r[0]] ? 'NS' : 'SG' };
  }).filter(Boolean);
}
function count(){ return Object.keys(cart).reduce(function(s, k){ return s + cart[k]; }, 0); }
function bar(){
  var L = cartLines(), n = count();
  $('bCount').textContent = n; $('bTotal').textContent = inr(total(L));
  $('bar').classList.toggle('hide', !n || $('vShop').classList.contains('hide'));
}
$('bar').onclick = showCart;
function show(v){
  ['vShop', 'vCart', 'vDone'].forEach(function(x){ $(x).classList.toggle('hide', x !== v); });
  $('shopTop').classList.toggle('hide', v !== 'vShop');
  window.scrollTo(0, 0); bar();
}
function showCart(){ show('vCart'); renderCart(); fillShop(); if (location.hash !== '#cart') history.pushState(null, '', '#cart'); }
$('backShop').onclick = function(){ if (location.hash === '#cart') history.back(); else { show('vShop'); render(); } };
window.addEventListener('popstate', function(){ if (location.hash !== '#cart' && !$('vCart').classList.contains('hide')) { show('vShop'); render(); } });

function renderCart(){
  var L = cartLines();
  if (!L.length) { $('lines').innerHTML = '<div class="empty" style="border:0">' + P + '<path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/></svg><b>Your cart is empty</b>Add items from the price list.<div class="eb"><button onclick="document.getElementById(\'backShop\').click()">Browse items</button></div></div>'; $('tots').innerHTML = ''; updWa(); return; }
  $('lines').innerHTML = L.map(function(l){
    var r = BYKEY[l.key];
    return '<div class="line" data-k="' + esc(l.key) + '">' + pic(r) + '<div class="info"><div class="nm">' + esc(l.name) + '</div><div class="sub">' + esc(l.code || '') + (l.code ? ' · ' : '') + inr(l.rate) + (l.unit ? ' ' + esc(l.unit) : '') + '</div></div><div class="ctl">' + stepper(l.qty) + '<button class="rm">Remove</button><div class="amt">' + inr(l.rate * l.qty) + '</div></div></div>';
  }).join('');
  var g = splitByRoute(L), h = '';
  if (g.NS && g.SG) { h += '<div class="subt"><span>' + ROUTE_UI.SG + '</span><span>' + inr(total(g.SG)) + '</span></div><div class="subt"><span>' + ROUTE_UI.NS + '</span><span>' + inr(total(g.NS)) + '</span></div>'; }
  h += '<div class="tot"><span>Grand total <small style="font-weight:400;font-size:12px">(incl. GST)</small></span><span>' + inr(total(L)) + '</span></div>';
  $('tots').innerHTML = h; updWa();
}
var SHOPF = ['shop', 'rname', 'phone', 'town', 'note'];
function getShop(){ var s = {}; SHOPF.forEach(function(f){ s[f] = $(f).value.trim(); }); return s; }
function fillShop(){ var s = load('ns_shop', {}); SHOPF.forEach(function(f){ if (f !== 'note' && s[f] && !$(f).value) $(f).value = s[f]; }); }
SHOPF.forEach(function(f){ $(f).addEventListener('input', function(){ var s = getShop(); delete s.note; save('ns_shop', s); $('shop').classList.remove('err'); updWa(); }); });
function updWa(){ $('wa').href = waLink(getShop(), cartLines(), new Date()); }
$('wa').addEventListener('click', function(e){ if (!checkShop()) { e.preventDefault(); } else updWa(); });
function checkShop(){
  if (!cartLines().length) { warn('Your cart is empty.'); return false; }
  if (!$('shop').value.trim()) { $('shop').classList.add('err'); $('shop').focus(); warn('Please enter your shop name.'); return false; }
  warn(''); return true;
}
function warn(t){ $('cartWarn').innerHTML = t ? '<div class="warn">' + esc(t) + '</div>' : ''; }

$('place').onclick = function(){
  if (!checkShop()) return;
  var shop = getShop(), L = cartLines(), date = new Date();
  var oid = orderId(date);
  var g = splitByRoute(L), routes = Object.keys(g).sort().reverse();
  var btn = this; btn.disabled = true; btn.textContent = 'Sending…';
  function send(rt){
    var ctl = window.AbortController ? new AbortController() : null;
    var t = setTimeout(function(){ if (ctl) ctl.abort(); }, 25000);
    return fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(emailPayload(rt, shop, g[rt], date, oid)), signal: ctl ? ctl.signal : undefined })
      .then(function(r){ return r.json(); }).then(function(j){ clearTimeout(t); return { rt: rt, ok: j && (j.success === true || j.success === 'true'), msg: j && j.message }; })
      .catch(function(err){ clearTimeout(t); return { rt: rt, ok: false, msg: 'network error' }; });
  }
  var res = [];
  routes.reduce(function(pr, rt){ return pr.then(function(){ return send(rt).then(function(x){ res.push(x); }); }); }, Promise.resolve()).then(function(){
    btn.disabled = false; btn.textContent = 'Place Order';
    var bad = res.filter(function(x){ return !x.ok; });
    var wl = waLink(shop, L, date);
    if (bad.length === res.length) { warn('Could not send the order by email (' + (bad[0].msg || 'network error') + '). Please tap “Send order on WhatsApp” instead.'); return; }
    $('wa2').href = wl;
    $('doneMsg').innerHTML = 'Order ID <b>' + oid + '</b><br>' + inr(total(L)) + ' (incl. GST)<br>' +
      (res.length > 1 ? res.map(function(x){ return (x.ok ? '✓ ' : '✗ ') + ROUTE_UI[x.rt] + (x.ok ? ' – received' : ' – not sent'); }).join('<br>') : '✓ Sent to our office') +
      (bad.length ? '<br><b>Please send this order on WhatsApp so nothing is missed.</b>' : '');
    if (!bad.length) { cart = {}; save('ns_cart', cart); }
    history.replaceState(null, '', location.pathname); show('vDone');
  });
};
$('newOrder').onclick = function(){ cart = {}; save('ns_cart', cart); show('vShop'); render(); };

function foot(){
  var h = '<b>Price lists used (effective date)</b><div class="dates">';
  CATS.forEach(function(c){ h += '<div><span>' + esc(c) + '</span><span>' + esc(D.dates[c] || '') + '</span></div>'; });
  h += '</div><p>Your Rate = List Price − 35% (Chimneys, Cooktops &amp; Hobs: − 30%). Rates incl. GST, subject to change. Final bill as per stock and current price list. “Best seller” / “Popular” = our counter’s top-selling items. Product photos: havells.com.</p>' +
    '<p><a href="../">← All price lists</a> · Havells Galaxy – Sangam, Bank Road, Motihari</p>';
  $('foot').innerHTML = h;
}
})();

</script>
